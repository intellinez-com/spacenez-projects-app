name: Deploy SpaceNez

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: spacenez-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish app image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/spacenez-projects-app:${{ github.sha }}
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Ubuntu server
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          SERVER_SSH_KEY: ${{ secrets.PROD_SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.PROD_SERVER_HOST }}
          SSH_PORT: ${{ secrets.SERVER_PORT || 22 }}
        run: |
          set -Eeuo pipefail
          SSH_KEY_PATH="$RUNNER_TEMP/spacenez_deploy_key"
          printf '%s\n' "$SERVER_SSH_KEY" > "$SSH_KEY_PATH"
          chmod 600 "$SSH_KEY_PATH"
          echo "SSH_KEY_PATH=$SSH_KEY_PATH" >> "$GITHUB_ENV"
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" "$SERVER_HOST" > "$RUNNER_TEMP/known_hosts"
          chmod 644 "$RUNNER_TEMP/known_hosts"

      - name: Sync Compose configuration to host
        env:
          SERVER_HOST: ${{ secrets.PROD_SERVER_HOST }}
          SERVER_USER: ${{ secrets.USER }}
          SSH_PORT: ${{ secrets.SERVER_PORT || 22 }}
        run: |
          set -Eeuo pipefail
          scp \
            -i "$SSH_KEY_PATH" \
            -P "$SSH_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            compose.prod.yml \
            "${SERVER_USER}@${SERVER_HOST}:/opt/spacenez/compose.prod.yml"

      - name: Pull, deploy, and verify (with rollback)
        env:
          SERVER_HOST: ${{ secrets.PROD_SERVER_HOST }}
          SERVER_USER: ${{ secrets.USER }}
          SSH_PORT: ${{ secrets.SERVER_PORT }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          # Actions supplies this run-scoped package token; no PAT is added as
          # a repository secret or baked into the image.
          printf '%s' "$GHCR_TOKEN" | ssh \
            -i "$SSH_KEY_PATH" \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            "${SERVER_USER}@${SERVER_HOST}" \
            'docker login ghcr.io --username "'"$GHCR_OWNER"'" --password-stdin'

          ssh \
            -i "$SSH_KEY_PATH" \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            "${SERVER_USER}@${SERVER_HOST}" \
            "APP_VERSION='$IMAGE_TAG' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/spacenez
          test -f .env.production || { echo 'SpaceNez runtime environment is missing'; exit 1; }
          test -f compose.prod.yml || { echo 'compose.prod.yml is missing'; exit 1; }

          PREV_TAG=''
          if [ -f /opt/spacenez/current_version ]; then
            PREV_TAG=$(cat /opt/spacenez/current_version)
          fi

          echo "Deploying SpaceNez ${APP_VERSION} (previous: ${PREV_TAG:-none})"
          APP_VERSION="$APP_VERSION" docker compose --env-file .env.production -f compose.prod.yml pull spacenez
          APP_VERSION="$APP_VERSION" docker compose --env-file .env.production -f compose.prod.yml up -d --remove-orphans spacenez

          READY=0
          for i in $(seq 1 15); do
            if curl --fail --silent --show-error http://127.0.0.1:5200/auth >/dev/null 2>&1; then
              READY=1
              echo "SpaceNez readiness passed on attempt $i/10."
              break
            fi
            sleep 3
          done

          if [ "$READY" -ne 1 ]; then
            echo 'SpaceNez failed readiness on 127.0.0.1:5200/auth'
            if [ -n "$PREV_TAG" ]; then
              echo "Rolling back to ${PREV_TAG}"
              APP_VERSION="$PREV_TAG" docker compose --env-file .env.production -f compose.prod.yml up -d --remove-orphans spacenez
              for i in $(seq 1 10); do
                if curl --fail --silent http://127.0.0.1:5200/auth >/dev/null 2>&1; then
                  echo 'Rollback readiness passed.'
                  break
                fi
                sleep 3
              done
              curl --fail --silent http://127.0.0.1:5200/auth >/dev/null || echo 'Rollback health check also failed.'
            fi
            docker compose --env-file .env.production -f compose.prod.yml logs --tail=100 spacenez
            exit 1
          fi

          printf '%s\n' "$APP_VERSION" > /opt/spacenez/current_version.tmp
          mv -f /opt/spacenez/current_version.tmp /opt/spacenez/current_version
          echo "SpaceNez deployed and ready at version $APP_VERSION"
          REMOTE
